# A good example can be found here:
# https://github.com/10up/action-wordpress-plugin-deploy/blob/develop/examples/deploy-on-publishing-a-new-release-and-attach-a-zip-file-to-the-release.yml

name: Deploy to WordPress.org

on:
  release:
    types: [released]

permissions:
  contents: write

concurrency:
  group: wordpress-org-release
  cancel-in-progress: false

jobs:
  release:
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: Verify release tag
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$GITHUB_REF_NAME"

      - name: Run quality gate
        run: npm run quality

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: videomail-for-ninja-forms

      # After the deploy, we also want to create a zip and upload it to the release on Github. We don't want
      # users to have to go to the repository to find our plugin :).
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/videomail-for-ninja-forms.zip
