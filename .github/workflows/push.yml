name: Test Runner

on:
  push:
    branches:
      - develop
      - master

  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier-lint-and-build:
    name: Run Prettier, Linter and Build
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7

      - name: 🪛 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: Check PHP syntax
        run: npm run lint:php

      - name: Check formatting, JavaScript and build
        run: npm run check

      - name: Verify committed build output
        run: |
          if [[ -n "$(git status --porcelain -- target)" ]]; then
            git status --short -- target
            exit 1
          fi
