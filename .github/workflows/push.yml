name: Test Runner

on:
  push:
    branches:
      - develop
      - master

  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Run tests, lint and build
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs (version in the comment), bumped by Dependabot
      - name: 🛒 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Keep the token out of .git/config while npm ci runs third-party code
          persist-credentials: false

      - name: 🪛 Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.1"
          coverage: none

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

      - name: Verify committed build output
        if: ${{ github.ref == 'refs/heads/master' || github.base_ref == 'master' }}
        run: |
          if [[ -n "$(git status --porcelain -- target)" ]]; then
            echo "::error::Generated build output under target/ is missing from the commit or out of date."
            echo "Prepare releases with 'npm run release' to rebuild and commit the target/ files."
            echo "Git status for target/:"
            git status --short -- target
            exit 1
          fi
